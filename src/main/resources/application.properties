spring.application.name=kundtjänsten
# --- MySQL ---
spring.datasource.url=jdbc:mysql://${SPRING_HOSTNAME}:3306/customer?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${SPRING_USER}
spring.datasource.password=${SPRING_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# --- spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# --- Server ---
server.port=8081
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

booking-service.url=${BOOKING_SERVICE}
